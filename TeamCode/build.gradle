apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

// Pedro Pathing (decision 012, issue #25). Added HERE, not in FIRST's root Gradle files (decision 001),
// so SDK updates still merge cleanly. Versions match Pedro's own Quickstart (11/25):
//   revhub = Pedro 3 for REV hubs (Follower, Mecanum drive, Pinpoint localizer; pulls in "core" itself)
//   tuning = the AutoTune web page that runs the tuning steps (pedro/ and opmodes/test/pedro/)
// Pedro itself comes from mavenCentral (already listed in build.dependencies.gradle). The tuning library
// also needs "Sloth" (dev.frozenmilk), which only lives on the Dairy repository below.
repositories {
    maven { url 'https://repo.dairy.foundation/releases/' }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.3'
}
